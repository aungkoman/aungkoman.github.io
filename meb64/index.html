<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>သင်တန်းသားများ စာရင်း</title>
    <!-- Google Fonts (Padauk & Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #10b981;
            --secondary-dark: #059669;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            /* Smooth scrolling + content ကို fixed header အောက်မှာ မကွယ်စေရန် */
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Padauk', 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 40px;
            /* padding-top ကို JavaScript မှ header အမြင့်အလိုက် အလိုအလျောက် သတ်မှတ်ပါမည် */
            padding-top: 160px;
        }

        /* ==========================================
           FIXED HEADER (အမြဲအပေါ်တွင် ကပ်နေမည်)
           ========================================== */
        .app-header {
            position: fixed;      /* sticky အစား fixed သုံးထားသည် */
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            color: white;
            padding: 24px 20px 36px;
            /* iPhone notch / safe area အတွက် */
            padding-top: calc(24px + env(safe-area-inset-top, 0px));
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
            /* အောက်က content မြင်ရအောင် နည်းနည်း blur ထည့်ထားသည် */
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
        }

        /* အောက်သို့ scroll လုပ်လျှင် အရိပ်ကို ပိုထင်ရှားစေရန် */
        .app-header.is-scrolled {
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.25);
        }

        .header-content {
            max-width: 600px;
            margin: 0 auto;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 10px;
        }

        .header-top h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .badge-count {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Search & Filter Controls */
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 0;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.95rem;
            pointer-events: none;
        }

        .search-box input {
            width: 100%;
            padding: 12px 14px 12px 38px;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            background: white;
            color: var(--text-main);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            outline: none;
            /* iOS တွင် focus လုပ်လျှင် auto zoom မဖြစ်စေရန် */
            font-size: 16px;
        }

        .city-filter {
            padding: 0 12px;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            background: white;
            color: var(--text-main);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            outline: none;
            max-width: 130px;
            cursor: pointer;
            height: 46px;
        }

        /* ==========================================
           MAIN CONTAINER
           ========================================== */
        .container {
            max-width: 600px;
            margin: -16px auto 0;   /* header ၏ အောက်ခြေလုံးဝန်းမှုနှင့် ထပ်စေရန် */
            padding: 0 16px;
            position: relative;
            z-index: 1;
        }

        /* Student Card */
        .student-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .student-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .student-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
        }

        .student-info {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 0;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: #eff6ff;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            flex-shrink: 0;
            border: 1px solid #dbeafe;
        }

        .details {
            min-width: 0;
            flex: 1;
        }

        .id-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
            background: #eff6ff;
            padding: 2px 8px;
            border-radius: 6px;
            margin-bottom: 4px;
            font-family: 'Inter', sans-serif;
        }

        .student-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .meta-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 4px;
            font-size: 0.85rem;
            color: var(--text-muted);
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .meta-item i {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        /* Call Action Button */
        .call-btn {
            background-color: var(--secondary);
            color: white;
            text-decoration: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
            transition: background-color 0.2s, transform 0.15s;
            flex-shrink: 0;
            margin-left: 12px;
        }

        .call-btn:hover {
            background-color: var(--secondary-dark);
        }

        .call-btn:active {
            transform: scale(0.92);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            background: white;
            border-radius: 16px;
            color: var(--text-muted);
            display: none;
        }

        .empty-state i {
            font-size: 2.5rem;
            color: #cbd5e1;
            margin-bottom: 12px;
        }

        /* မျက်နှာပြင် အလွန်သေးငယ်လျှင် header ကို နည်းနည်းချုံ့ခြင်း */
        @media (max-width: 380px) {
            .header-top h1 {
                font-size: 1.15rem;
            }
            .app-header {
                padding-left: 14px;
                padding-right: 14px;
            }
        }
    </style>
</head>

        { id: "ကသ-၄၈", name: "ဒေါ် ယမင်းသူ",          city: "စီမံခန့်ခွဲရေးဌာနခွဲ",     phone: "09423325509" },
        { id: "ကသ-၄၉", name: "ဒေါ် ယွန်းဝတီစိုးညွန့်မောင်", city: "စီမံခန့်ခွဲရေးဌာနခွဲ", phone: "09449717457" },
        { id: "ကသ-၅၀", name: "ဒေါ် ရီယမုံအောင်",      city: "စီမံခန့်ခွဲရေးဌာနခွဲ",     phone: "09401234568" },
        { id: "ကသ-၅၁", name: "ဦး ရဲကျော်ဦး",          city: "စီမံခန့်ခွဲရေးဌာနခွဲ",     phone: "09970042927" },
        { id: "ကသ-၅၂", name: "ဒေါ် လှိုင်သဇင်ဦး",      city: "စီမံခန့်ခွဲရေးဌာနခွဲ",     phone: "09799305334" },
        { id: "ကသ-၅၃", name: "ဦး ဝေယံမြင့်",          city: "ICT",                   phone: "09672760088" },
        { id: "ကသ-၅၄", name: "ဒေါ် ဝိုင်းအိအိမိုး",     city: "စီမံခန့်ခွဲရေးဌာနခွဲ",     phone: "09400607857" },
        { id: "ကသ-၅၅", name: "ဒေါ် ဝင်းမာဦး",         city: "ပုလဲ",                  phone: "09798332776" },
        { id: "ကသ-၅၆", name: "ဒေါ် ဝင်းဝင်းသန်း",      city: "ဘဏ်တွင်းစာရင်းစစ်ဌာနခွဲ", phone: "09425012740" },
        { id: "ကသ-၅၇", name: "ဒေါ် သုနန္ဒာဦး",        city: "စီမံခန့်ခွဲရေးဌာနခွဲ",     phone: "09688687837" },
        { id: "ကသ-၅၈", name: "ဒေါ် သုနန္ဒာမြင့်",      city: "ပုသိမ်",                phone: "09784346740" },
        { id: "ကသ-၅၉", name: "ဦး သန့်ဇင်စိုး",         city: "ကနီ",                   phone: "09967534592" },
        { id: "ကသ-၆၀", name: "ဒေါ် သန်းသန်းလွင်",     city: "မြင်းခြံ",               phone: "09688838035" },
        { id: "ကသ-၆၁", name: "ဦး အာကာမျိုး",          city: "စီမံခန့်ခွဲရေးဌာနခွဲ",     phone: "09403728043" },
        { id: "ကသ-၆၂", name: "ဒေါ် အိတင်ဇာကျော်",      city: "စီမံခန့်ခွဲရေးဌာနခွဲ",     phone: "09798933011" },
        { id: "ကသ-၆၃", name: "ဒေါ် အိသဇင်ဖြိုး",       city: "စီမံခန့်ခွဲရေးဌာနခွဲ",     phone: "09690510764" },
        { id: "ကသ-၆၄", name: "ဒေါ် အေးဝါဝါအောင်",     city: "မိုင်းရှူး",             phone: "09250342425" }
    ];

    // ==========================================
    // ၂။ App လုပ်ဆောင်ချက်များ (Logic)
    // ==========================================
    const studentListEl = document.getElementById('studentList');
    const searchInput   = document.getElementById('searchInput');
    const cityFilter    = document.getElementById('cityFilter');
    const totalCountEl  = document.getElementById('totalCount');
    const emptyStateEl  = document.getElementById('emptyState');
    const appHeaderEl   = document.getElementById('appHeader');

    // ------------------------------------------
    // (က) FIXED HEADER OFFSET
    // Header ရဲ့ အမြင့်အလိုက် body ရဲ့ padding-top ကို ချိန်ညှိခြင်း
    // (ဖုန်း rotate / ဖောင့် load / resize ဖြစ်လျှင်လည်း အလုပ်လုပ်သည်)
    // ------------------------------------------
    function syncHeaderOffset() {
        if (!appHeaderEl) return;
        const h = appHeaderEl.offsetHeight;
        document.body.style.paddingTop = h + 'px';
    }

    syncHeaderOffset();
    window.addEventListener('resize', syncHeaderOffset);
    window.addEventListener('orientationchange', syncHeaderOffset);
    window.addEventListener('load', syncHeaderOffset);

    // Padauk ဖောင့် load ပြီးချိန် အမြင့်ပြောင်းနိုင်သည်
    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(syncHeaderOffset);
    }

    // Header အမြင့် ပြောင်းတိုင်း (ဥပမာ - စာသားလိုင်းခွဲခြင်း) ပြန်တွက်ရန်
    if ('ResizeObserver' in window) {
        new ResizeObserver(syncHeaderOffset).observe(appHeaderEl);
    }

    // ------------------------------------------
    // (ခ) Scroll လုပ်လျှင် header အရိပ် ပိုထင်ရှားစေခြင်း
    // ------------------------------------------
    let ticking = false;
    window.addEventListener('scroll', () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
            appHeaderEl.classList.toggle('is-scrolled', window.scrollY > 4);
            ticking = false;
        });
    }, { passive: true });

    // ------------------------------------------
    // (ဂ) မြို့အမည်များကို Filter Dropdown ထဲသို့ ထည့်ခြင်း
    // ------------------------------------------
    function populateCityFilter() {
        const cities = [...new Set(studentsData.map(s => s.city))].sort();
        cities.forEach(city => {
            const option = document.createElement('option');
            option.value = city;
            option.textContent = city;
            cityFilter.appendChild(option);
        });
    }

    // အမည်၏ ပထမစာလုံးကို Avatar အဖြစ်ယူခြင်း
    function getInitials(name) {
        return name ? name.trim().charAt(0) : '?';
    }

    // HTML escape (လုံခြုံရေးအတွက်)
    function esc(str) {
        return String(str).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    // ကျောင်းသားစာရင်းကို Screen ပေါ်တွင် ပြသခြင်း
    function renderStudents(data) {
        studentListEl.innerHTML = '';
        totalCountEl.textContent = `စုစုပေါင်း ${data.length} ဦး`;

        if (data.length === 0) {
            emptyStateEl.style.display = 'block';
            return;
        }
        emptyStateEl.style.display = 'none';

        const frag = document.createDocumentFragment();

        data.forEach(student => {
            const cleanPhone = student.phone.replace(/[\s-]/g, '');

            const card = document.createElement('div');
            card.className = 'student-card';
            card.innerHTML = `
                <div class="student-info">
                    <div class="avatar">${esc(getInitials(student.name))}</div>
                    <div class="details">
                        <span class="id-badge">${esc(student.id)}</span>
                        <div class="student-name">${esc(student.name)}</div>
                        <div class="meta-row">
                            <span class="meta-item">
                                <i class="fa-solid fa-location-dot"></i> ${esc(student.city)}
                            </span>
                            <span class="meta-item">
                                <i class="fa-solid fa-phone"></i> ${esc(student.phone)}
                            </span>
                        </div>
                    </div>
                </div>
                <a href="tel:${esc(cleanPhone)}" class="call-btn" title="${esc(student.name)} ထံ ဖုန်းခေါ်ရန်">
                    <i class="fa-solid fa-phone-flip"></i>
                </a>
            `;
            frag.appendChild(card);
        });

        studentListEl.appendChild(frag);
    }

    // ရှာဖွေခြင်းနှင့် မြို့အလိုက် စစ်ထုတ်ခြင်း
    function filterData() {
        const searchTerm   = searchInput.value.toLowerCase().trim();
        const selectedCity = cityFilter.value;

        const filtered = studentsData.filter(student => {
            const matchesSearch =
                student.name.toLowerCase().includes(searchTerm) ||
                student.id.toLowerCase().includes(searchTerm) ||
                student.phone.includes(searchTerm);

            const matchesCity = selectedCity === 'all' || student.city === selectedCity;

            return matchesSearch && matchesCity;
        });

        renderStudents(filtered);
    }

    // Event Listeners
    searchInput.addEventListener('input', filterData);
    cityFilter.addEventListener('change', filterData);

    // စတင်ဖွင့်ချိန်တွင် အလုပ်လုပ်ရန်
    populateCityFilter();
    renderStudents(studentsData);
</script>
</body>
</html>
