        const studentListEl = document.getElementById('studentList');
        const searchInput = document.getElementById('searchInput');
        const cityFilter = document.getElementById('cityFilter');
        const totalCountEl = document.getElementById('totalCount');
        const emptyStateEl = document.getElementById('emptyState');

        // မြို့အမည်များကို Filter Dropdown ထဲသို့ အလိုအလျောက်ထည့်သွင်းခြင်း
        function populateCityFilter() {
            const cities = [...new Set(studentsData.map(student => student.city))];
            cities.forEach(city => {
                const option = document.createElement('option');
                option.value = city;
                option.textContent = city;
                cityFilter.appendChild(option);
            });
        }

        // အမည်၏ ပထမစာလုံးကို Avatar အဖြစ်ယူခြင်း
        function getInitials(name) {
            return name ? name.trim().charAt(0) : '?';
        }

        // ကျောင်းသားစာရင်းကို Screen ပေါ်တွင် ပြသခြင်း
        function renderStudents(data) {
            studentListEl.innerHTML = '';
            totalCountEl.textContent = `စုစုပေါင်း ${data.length} ဦး`;

            if (data.length === 0) {
                emptyStateEl.style.display = 'block';
                return;
            } else {
                emptyStateEl.style.display = 'none';
            }

            data.forEach(student => {
                // ဖုန်းနံပါတ်မှ space နှင့် - များကို ဖယ်ရှားပြီး tel: link အတွက် ပြင်ဆင်ခြင်း
                const cleanPhone = student.phone.replace(/[\s-]/g, '');

                const card = document.createElement('div');
                card.className = 'student-card';
                card.innerHTML = `
                    <div class="student-info">
                        <div class="avatar">${getInitials(student.name)}</div>
                        <div class="details">
                            <span class="id-badge">${student.id}</span>
                            <div class="student-name">${student.name}</div>
                            <div class="meta-row">
                                <span class="meta-item">
                                    <i class="fa-solid fa-location-dot"></i> ${student.city}
                                </span>
                                <span class="meta-item">
                                    <i class="fa-solid fa-phone"></i> ${student.phone}
                                </span>
                            </div>
                        </div>
                    </div>
                    <a href="tel:${cleanPhone}" class="call-btn" title="${student.name} ထံ ဖုန်းခေါ်ရန်">
                        <i class="fa-solid fa-phone-flip"></i>
                    </a>
                `;
                studentListEl.appendChild(card);
            });
        }

        // ရှာဖွေခြင်းနှင့် မြို့အလိုက် စစ်ထုတ်ခြင်း
        function filterData() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            const selectedCity = cityFilter.value;

            const filtered = studentsData.filter(student => {
                const matchesSearch = 
                    student.name.toLowerCase().includes(searchTerm) ||
                    student.id.toLowerCase().includes(searchTerm) ||
                    student.phone.includes(searchTerm);
                
                const matchesCity = selectedCity === 'all' || student.city === selectedCity;

                return matchesSearch && matchesCity;
            });

            renderStudents(filtered);
        }

        // Event Listeners
        searchInput.addEventListener('input', filterData);
        cityFilter.addEventListener('change', filterData);

        // စတင်ဖွင့်ချိန်တွင် အလုပ်လုပ်ရန်
        populateCityFilter();
        renderStudents(studentsData);
    </script>
