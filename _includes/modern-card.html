{% include resolve-cover.html item=post %}
<article class="post-card">
  <a class="card-cover" href="{{ post.url | relative_url }}" aria-hidden="true" tabindex="-1"><img src="{{ cover_base | append: '-480.jpg' | relative_url }}" srcset="{{ cover_base | append: '-480.jpg' | relative_url }} 480w, {{ cover_base | append: '-800.jpg' | relative_url }} 800w, {{ cover_photo.image | relative_url }} 1280w" sizes="(min-width: 1024px) 370px, (min-width: 640px) 50vw, calc(100vw - 32px)" width="1280" height="720" alt="" loading="lazy" decoding="async"></a>
  <div class="card-body"><div class="card-meta"><span>{{ post.categories | first | default: 'Notes' | escape }}</span><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%b %d, %Y' }}</time></div><h3><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h3><p>{{ post.excerpt | strip_html | truncate: 155 }}</p><a class="read-link" href="{{ post.url | relative_url }}" aria-label="Read {{ post.title | escape }}">Read article <span aria-hidden="true">↗</span></a></div>
</article>
