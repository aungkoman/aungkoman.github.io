name: Notify Telegram of new posts
on:
  workflow_run:
    workflows: ["Build and deploy Jekyll site"]
    types: [completed]
    branches: [master]
permissions:
  contents: read
concurrency:
  group: telegram-posts
  cancel-in-progress: false
jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Install front matter parser
        run: python -m pip install PyYAML==6.0.2
      - name: Send published post links
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, json, urllib.request, urllib.parse, xml.etree.ElementTree as ET
          import yaml
          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat = os.environ.get("TELEGRAM_CHAT_ID")
          if not token or not chat:
              print("::notice::Set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID repository secrets to enable delivery.")
              raise SystemExit(0)
          paths = subprocess.check_output(["git", "diff", "--name-only", "--diff-filter=A", "HEAD^", "HEAD", "--", "_posts/"], text=True).splitlines()
          if not paths:
              print("No new posts in this deployment.")
              raise SystemExit(0)
          config = yaml.safe_load(pathlib.Path("_config.yml").read_text())
          feed_url = config["url"].rstrip("/") + config.get("baseurl", "").rstrip("/") + "/feed.xml"
          with urllib.request.urlopen(feed_url, timeout=30) as response:
              feed = ET.fromstring(response.read())
          ns = {"a": "http://www.w3.org/2005/Atom"}
          entries = {}
          for entry in feed.findall("a:entry", ns):
              title = entry.findtext("a:title", namespaces=ns)
              for link in entry.findall("a:link", ns):
                  if link.get("rel", "alternate") == "alternate":
                      entries[title] = link.get("href")
                      break
          for path in paths:
              text = pathlib.Path(path).read_text()
              if not text.startswith("---"):
                  continue
              meta = yaml.safe_load(text.split("---", 2)[1]) or {}
              if meta.get("published") is False:
                  continue
              title = str(meta.get("title", ""))
              link = entries.get(title)
              if not link:
                  raise SystemExit("New post was not found in the deployed Atom feed.")
              excerpt = str(meta.get("excerpt", "")).strip()
              message = title + ("\n\n" + excerpt[:800] if excerpt else "") + "\n\n" + link
              body = urllib.parse.urlencode({"chat_id": chat, "text": message}).encode()
              try:
                  with urllib.request.urlopen(urllib.request.Request("https://api.telegram.org/bot" + token + "/sendMessage", data=body), timeout=30) as response:
                      result = json.load(response)
                  if not result.get("ok"):
                      raise RuntimeError("Telegram rejected delivery")
              except Exception:
                  raise SystemExit("Telegram delivery failed; verify repository secrets and bot access.")
              print("Published post notification delivered.")
          PY
