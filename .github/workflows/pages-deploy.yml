name: Build and deploy Jekyll site

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - name: Install dependencies
        run: bundle install
      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination ./_site
      - name: Verify generated website
        run: python3 scripts/verify-site.py
      - name: Install browser checks
        run: |
          npm install --prefix "$RUNNER_TEMP/blog-ui" --no-save playwright@1.62.1
          node "$RUNNER_TEMP/blog-ui/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify mobile and desktop layout
        env:
          NODE_PATH: ${{ runner.temp }}/blog-ui/node_modules
        run: node scripts/verify-mobile-ui.cjs
      - name: Upload layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-desktop-layout
          path: ui-checks/
          if-no-files-found: ignore
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
