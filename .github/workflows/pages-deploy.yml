name: Build and deploy Next.js blog
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nextjs-blog/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix nextjs-blog
      - name: Test Markdown and permalink compatibility
        run: npm test --prefix nextjs-blog
      - name: Export Next.js and preserve legacy assets
        run: npm run build --prefix nextjs-blog
      - name: Verify every article, historical URL, image and feed
        run: npm run verify --prefix nextjs-blog
      - name: Install Chromium for browser verification
        run: npx --prefix nextjs-blog playwright install --with-deps chromium
      - name: Verify mobile layout and hydrated search
        working-directory: nextjs-blog
        run: node scripts/mobile-ui.cjs
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: nextjs-blog/out
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
